# ============================================================================
#  DOMAIN CONFIG  —  غيّر هذا الملف فقط يوم الهاكاثون بعد اختيار المشكلة
#  Everything problem-specific lives here. No code changes needed.
# ============================================================================

product_name: "مُرشد"            # اسم المنتج (يظهر في الواجهة والـ prompt)
tagline: "إجابات موثوقة من مصادرك، مع ذكر المصدر"
language: "ar"                     # ar | en  (لغة الرد الافتراضية)
audience: "المستخدمون المستهدفون (عدّلها حسب المشكلة)"

# من هو المساعد؟ (جملة أو جملتين)
persona: >
  أنت مساعد ذكي متخصص يجيب عن أسئلة المستخدمين اعتماداً فقط على المستندات الموثوقة المرفقة.

# تعليمات إضافية خاصة بالمجال تُضاف إلى الـ system prompt
# مثال للمجال الصحي: "لا تقدم تشخيصاً. عند ذكر أعراض طارئة انصح بالتوجه للطوارئ فوراً."
# مثال للقانوني: "اذكر رقم المادة دائماً، ونبّه أن الإجابة ليست استشارة قانونية."
system_prompt_extra: ""

# الرسالة عند غياب المعلومة في المصادر (رفض بدل الهلوسة)
refusal_message: "عذراً، لم أجد معلومات كافية في المصادر المتاحة للإجابة عن هذا السؤال. جرّب إعادة صياغة السؤال أو تواصل مع الجهة المختصة."

# تنبيه يظهر أسفل كل إجابة (اتركه فارغاً إن لم يلزم)
disclaimer: ""

# رسالة التصعيد لموظف بشري عند عدم اليقين
escalation_message: ""

# أسئلة مقترحة تظهر في واجهة الدردشة
sample_questions:
  - "ما هي الخطوات المطلوبة لـ ...؟"
  - "ما الشروط الخاصة بـ ...؟"
  - "اشرح لي ... بلغة بسيطة"

# أمثلة لأسئلة خارج النطاق (تُستخدم في التقييم والعرض)
out_of_scope_examples:
  - "من فاز بكأس العالم 2022؟"

# حقول metadata يمكن الفلترة بها من الواجهة (مثل: category, year, version)
metadata_filters:
  - category

# صلاحيات الوصول (RBAC) — كل دور يرى تصنيفات معينة فقط (اسم المجلد في data/raw = category)
# اتركه فارغاً {} لإلغاء القيود. مثال للمشكلة 6:
# role_categories:
#   anonymous: [public]
#   user: [public, employees]
#   admin: null          # null = يرى كل شيء
role_categories: {}
